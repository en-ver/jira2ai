[project]
name = "jira2mcp"
version = "0.7.0"
description = "MCP server exposing Jira Cloud tools via FastMCP"
readme = "README.md"
authors = [
    { name = "en-ver" }
]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.2.0,<4",
    "httpx>=0.28.1",
    "adf-bridge>=0.1.3,<0.2",
    "jira2py==0.15.0",
    "pydantic>=2.12.5",
]

[project.scripts]
jira2mcp = "jira2mcp:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.12"]
build-backend = "uv_build"
